# Perfil "local": BD en memoria para desarrollar y probar sin RDS.
# Ejecutar con: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:mem:pedidos;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Sin RabbitMQ local: que /actuator/health no reporte DOWN por el broker.
# (En la nube se deja activo, así health muestra si RabbitMQ está disponible.)
management.health.rabbit.enabled=false
